apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopswift-green
  namespace: ecommerce-bluegreen
  labels:
    app: shopswift
    environment: green
    version: v2.1.0-broken
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopswift
      environment: green
  template:
    metadata:
      labels:
        app: shopswift
        environment: green
        version: v2.1.0-broken
    spec:
      containers:
        - name: shopswift
          image: shopswift:v2.0.0
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
          env:
            - name: APP_NAME
              value: "ShopSwift"
            - name: APP_VERSION
              value: "v2.1.0-broken"
            - name: APP_ENV
              value: "green"
            - name: GIT_COMMIT
              value: "broken-green-readiness"
            - name: PORT
              value: "3000"
            - name: FORCE_NOT_READY
              value: "true"
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 100
            capabilities:
              drop:
                - ALL
