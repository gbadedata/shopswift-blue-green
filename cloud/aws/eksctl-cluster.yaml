apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: shopswift-bluegreen-eks
  region: us-east-1
  version: "1.30"

managedNodeGroups:
  - name: shopswift-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    volumeSize: 20
    privateNetworking: false
    labels:
      role: worker
      project: shopswift-bluegreen
    tags:
      Project: shopswift-bluegreen
      Environment: training
      Owner: gbadedata
